<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Moteur KM</title>
<style>
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Light.otf"); font-weight: 300; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "InterDisplay"; src: url("../assets/fonts/InterDisplay-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "InterDisplay"; src: url("../assets/fonts/InterDisplay-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "InterDisplay"; src: url("../assets/fonts/InterDisplay-ExtraBold.otf"); font-weight: 800; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="kit.js"></script>
<script src="site.js"></script>
<script src="seq/s01.js"></script>
<script src="seq/s02.js"></script>
<script src="seq/s03.js"></script>
<script src="seq/s04.js"></script>
<script src="seq/s05.js"></script>
<script src="seq/s06.js"></script>
<script src="seq/s07.js"></script>
<script src="seq/s08.js"></script>
<script src="seq/s09.js"></script>
<script src="seq/s10.js"></script>
<script>
// Démarrage : la configuration est injectée par tools/render.js (window.__CFG)
window.boot = async function () {
  const cfg = window.__CFG;
  const scale = cfg.scale || 1;
  const cv = document.getElementById('c');
  cv.width = Math.round(E.W * scale); cv.height = Math.round(E.H * scale);
  E.canvas = cv; E.ctx = cv.getContext('2d', { willReadFrequently: true }); E.px = scale;
  // {{VAR}} → valeur
  const sub = s => String(s).replace(/\{\{(\w+)\}\}/g, (_, k) => cfg.texts[k] ?? '');
  cfg.strings = Object.fromEntries(Object.entries(cfg.strings).map(([k, v]) => [k, sub(v)]));
  E.setup(cfg);
  await document.fonts.ready;
  await Promise.all([...document.fonts].map(f => f.load()));
  await E.logoReady;
  return { total: E.total, fps: E.fps, timeline: E.timeline.map(s => ({ id: s.id, start: s.start, dur: s.dur })) };
};
// Planning des emplacements médias : [{slot, start, dur}] en secondes absolues
window.slotSchedule = () => E.timeline.flatMap((s, i) => { const d = E.seqs[s.id]; return d && d.slots ? d.slots(E.ctxFor(i, s.start)) : []; });
// Lecture des pixels (RGBA brut, base64) pour l'encodage
window.grab = function () {
  const c = E.canvas, d = E.ctx.getImageData(0, 0, c.width, c.height).data;
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < d.length; i += CH) s += String.fromCharCode.apply(null, d.subarray(i, i + CH));
  return btoa(s);
};
</script>
</body>
</html>
